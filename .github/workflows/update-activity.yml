name: Update recent GitHub activity
on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *' # 08:17 IST, after the workbench refresh
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/update_activity.py
      - name: Commit changed activity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh recent GitHub activity'
            git push
          fi
